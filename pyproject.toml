[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
    "--cov=identity",
    "--cov=portal",
    "--cov=services",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit:        Fast, isolated unit tests (no DB, no network)",
    "integration: Tests that call real services or DB",
    "requires_db: Tests that need a live PostgreSQL database (skipped when unavailable)",
    "e2e:         End-to-end browser tests via Playwright",
    "regression:  Critical path regression tests",
    "performance: Load and stress tests (Locust)",
    "security:    Security-focused tests (OWASP, rate limits)",
    "slow:        Tests that take > 2s",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/conftest.py",
    "*/__init__.py",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
