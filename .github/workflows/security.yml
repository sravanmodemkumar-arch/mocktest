name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight

jobs:
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tools
        run: pip install bandit safety

      - name: Bandit static analysis
        run: bandit -r portal/ services/ -ll --exclude identity/

      - name: Safety dependency audit
        run: |
          safety check -r portal/requirements.txt
          safety check -r services/auth/requirements.txt
          safety check -r services/home/requirements.txt
          safety check -r services/tenant/requirements.txt
        continue-on-error: true
