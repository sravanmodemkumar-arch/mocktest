name: CI

on:
  push:
    branches: [main, feature/implementation]
  pull_request:
    branches: [main]

jobs:

  # ── Unit & Integration tests ───────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install service dependencies
        run: |
          pip install -r portal/requirements.txt
          pip install -r services/auth/requirements.txt
          pip install -r services/home/requirements.txt
          pip install -r services/tenant/requirements.txt

      - name: Lint (critical errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
             --exclude=venv,migrations,identity

      - name: Format check
        run: black --check . --exclude="venv|migrations|identity"

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short --timeout=30
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/portal
          DJANGO_SETTINGS_MODULE: portal.settings

      - name: Integration tests
        run: pytest tests/integration/ -v --tb=short --timeout=60
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/portal
          DJANGO_SETTINGS_MODULE: portal.settings

      - name: Coverage report
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=portal --cov=services \
            --cov-report=term-missing \
            --cov-fail-under=70
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/portal
          DJANGO_SETTINGS_MODULE: portal.settings

  # ── Security scan ──────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install bandit safety

      - name: Bandit static analysis
        run: bandit -r portal/ services/ -ll --exclude identity/
        continue-on-error: false

      - name: Safety dependency audit
        run: |
          safety check -r portal/requirements.txt
          safety check -r services/auth/requirements.txt
          safety check -r services/home/requirements.txt
          safety check -r services/tenant/requirements.txt
        continue-on-error: true   # advisory only — don't fail build

  # ── Regression tests ───────────────────────────────────────────────────────
  regression:
    name: Regression
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt -r portal/requirements.txt
      - name: Run regression suite
        run: pytest tests/regression/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/portal
          DJANGO_SETTINGS_MODULE: portal.settings
