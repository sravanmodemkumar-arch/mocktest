<!-- Session Expired Overlay — HTMX swaps this into #session-modal-container -->
<div id="session-expired-modal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
     role="dialog" aria-modal="true" aria-labelledby="session-title">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 space-y-5">

    <!-- Header -->
    <div class="text-center space-y-1">
      <div class="w-14 h-14 rounded-full bg-amber-100 flex items-center justify-center mx-auto">
        <svg class="w-7 h-7 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
      </div>
      <h3 id="session-title" class="text-lg font-bold text-gray-900">Session Expired</h3>
      <p class="text-sm text-gray-500">Your session timed out. Enter your password to continue.</p>
    </div>

    <!-- Re-auth form (password-based) -->
    <form hx-post="/session/reauth/"
          hx-target="#session-expired-modal"
          hx-swap="outerHTML"
          class="space-y-4">
      {% csrf_token %}

      <!-- Login ID (pre-filled from user context) -->
      <div class="space-y-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Mobile / Email / Username</label>
        <input type="text" name="login_id" value="{{ user.mobile|default:user.email|default:'' }}"
               readonly
               class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 bg-gray-50 outline-none" />
      </div>

      <!-- Password -->
      <div class="space-y-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Password</label>
        <input type="password" name="password" required autofocus
               placeholder="Enter your password"
               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-900 outline-none focus:ring-2"
               style="--tw-ring-color: var(--brand);" />
      </div>

      <!-- Unsaved changes warning -->
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-700">
        Your unsaved changes will be preserved after re-authentication.
      </div>

      <div class="flex gap-3">
        <a href="/logout/"
           class="flex-1 py-2.5 rounded-lg border border-gray-300 text-sm font-medium
                  text-gray-700 hover:bg-gray-50 text-center">
          Logout
        </a>
        <button type="submit"
                class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-white"
                style="background-color: var(--brand);">
          Continue
        </button>
      </div>
    </form>

  </div>
</div>
