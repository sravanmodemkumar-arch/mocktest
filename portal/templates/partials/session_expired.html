<!-- Session Expired Overlay — HTMX swaps this into #session-modal-container -->
<div id="session-expired-modal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
     role="dialog" aria-modal="true" aria-labelledby="session-title">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 space-y-5">

    <!-- Header -->
    <div class="text-center space-y-1">
      <div class="w-14 h-14 rounded-full bg-amber-100 flex items-center justify-center mx-auto">
        <svg class="w-7 h-7 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
      </div>
      <h3 id="session-title" class="text-lg font-bold text-gray-900">Session Expired</h3>
      <p class="text-sm text-gray-500">Your session timed out. Re-enter OTP to continue.</p>
    </div>

    <!-- Re-auth form -->
    <form hx-post="/session/reauth/"
          hx-target="#session-expired-modal"
          hx-swap="outerHTML"
          class="space-y-4">
      {% csrf_token %}

      <!-- Mobile (pre-filled, readonly) -->
      <div class="space-y-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Mobile</label>
        <div class="flex rounded-lg border border-gray-200 bg-gray-50 overflow-hidden">
          <div class="px-3 py-2.5 text-gray-500 text-sm border-r border-gray-200">🇮🇳 +91</div>
          <input type="tel" name="mobile" value="{{ user.mobile|default:'' }}" readonly
                 class="flex-1 px-3 py-2.5 text-sm text-gray-700 bg-gray-50 outline-none" />
        </div>
      </div>

      <!-- OTP boxes -->
      <div class="space-y-1" id="reauth-otp-wrap" style="display:none;">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Enter OTP</label>
        <div class="flex gap-2">
          {% for i in "123456" %}
          <input type="text" maxlength="1" inputmode="numeric"
                 class="reauth-box w-9 h-11 text-center text-lg font-bold border-2 border-gray-300
                        rounded-lg outline-none focus:border-brand transition-all"
                 style="--tw-ring-color: var(--brand);" />
          {% endfor %}
        </div>
        <input type="hidden" name="otp" id="reauth-otp-value" />
      </div>

      <!-- Unsaved changes warning -->
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-700">
        ⚠ You have unsaved changes. They will be preserved after re-authentication.
      </div>

      <!-- Actions -->
      <div class="flex gap-3">
        <button type="button"
                id="send-reauth-otp"
                hx-post="/otp/send/"
                hx-include="[name='mobile']"
                hx-target="#reauth-otp-wrap"
                hx-swap="none"
                onclick="showOTPBoxes()"
                class="flex-1 py-2.5 rounded-lg border border-gray-300 text-sm font-medium
                       text-gray-700 hover:bg-gray-50">
          Send OTP
        </button>
        <button type="submit"
                class="btn-brand flex-1 py-2.5 rounded-lg text-sm font-semibold">
          Verify & Continue
        </button>
      </div>
    </form>

    <!-- Logout option -->
    <div class="text-center">
      <a href="/logout/" class="text-xs text-gray-400 hover:text-gray-600">
        Logout instead
      </a>
    </div>
  </div>
</div>

<script>
  function showOTPBoxes() {
    document.getElementById('reauth-otp-wrap').style.display = 'block';
    const boxes = document.querySelectorAll('.reauth-box');
    boxes.forEach((box, i) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/, '');
        if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
        document.getElementById('reauth-otp-value').value = [...boxes].map(b => b.value).join('');
      });
    });
    boxes[0].focus();
  }
</script>
