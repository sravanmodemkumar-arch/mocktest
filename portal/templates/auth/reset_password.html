{% extends "auth/base_auth.html" %}

{% block title %}Set New Password — {{ tenant_name }}{% endblock %}

{% block auth_content %}
<div class="space-y-8">

  <div>
    <h2 class="text-3xl font-bold text-gray-900">Set New Password</h2>
    <p class="mt-2 text-gray-500">Choose a strong password for your account.</p>
  </div>

  <form hx-post="/reset-password/"
        hx-target="#form-response"
        hx-swap="innerHTML"
        hx-indicator="#reset-btn"
        class="space-y-5">
    {% csrf_token %}

    <div class="space-y-1">
      <label for="password" class="block text-sm font-medium text-gray-700">New Password</label>
      <div class="relative">
        <input type="password"
               id="password"
               name="password"
               placeholder="At least 8 characters"
               required
               minlength="8"
               autocomplete="new-password"
               class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg text-gray-900 text-base
                      focus:outline-none focus:ring-2"
               style="--tw-ring-color: {{ primary_color }};"
               oninput="checkStrength(this.value)" />
        <button type="button" onclick="toggleField('password')" tabindex="-1"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7
                     -1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>
      <!-- Strength bar -->
      <div class="h-1 rounded-full bg-gray-100 overflow-hidden mt-1">
        <div id="strength-bar" class="h-full rounded-full transition-all duration-300" style="width:0"></div>
      </div>
      <p id="strength-label" class="text-xs text-gray-400"></p>
    </div>

    <div class="space-y-1">
      <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
      <div class="relative">
        <input type="password"
               id="confirm_password"
               name="confirm_password"
               placeholder="Repeat your new password"
               required
               autocomplete="new-password"
               class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg text-gray-900 text-base
                      focus:outline-none focus:ring-2"
               style="--tw-ring-color: {{ primary_color }};" />
        <button type="button" onclick="toggleField('confirm_password')" tabindex="-1"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7
                     -1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit"
            id="reset-btn"
            class="w-full py-3 px-6 rounded-lg font-semibold text-base text-white
                   flex items-center justify-center gap-2"
            style="background-color: {{ primary_color }};">
      <span class="htmx-indicator">
        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
      </span>
      <span>Set New Password</span>
    </button>

    <div id="form-response"></div>
  </form>

</div>

<script>
  function toggleField(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function checkStrength(val) {
    const bar = document.getElementById('strength-bar');
    const label = document.getElementById('strength-label');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { w: '0%',   color: 'transparent', text: '' },
      { w: '25%',  color: '#ef4444',     text: 'Weak' },
      { w: '50%',  color: '#f59e0b',     text: 'Fair' },
      { w: '75%',  color: '#3b82f6',     text: 'Good' },
      { w: '100%', color: '#22c55e',     text: 'Strong' },
    ];
    const l = levels[score];
    bar.style.width = l.w;
    bar.style.backgroundColor = l.color;
    label.textContent = l.text;
    label.style.color = l.color;
  }
</script>
{% endblock %}
